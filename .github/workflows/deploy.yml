name: Deploy Marvin foundation preview
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: marvin-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: marvin-web/package-lock.json
      - run: npm ci
      - name: Resolve Pages base
        shell: bash
        env:
          CONFIGURED_BASE: ${{ vars.PAGES_BASE_PATH }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          if [[ -n "$CONFIGURED_BASE" ]]; then
            echo "PAGES_BASE_PATH=$CONFIGURED_BASE" >> "$GITHUB_ENV"
          elif [[ "${repo,,}" == "${owner,,}.github.io" ]]; then
            echo 'PAGES_BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: marvin-web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
